<div class="app" id="app"></div><div id="toastBox"></div><div id="storyBox"></div>

<script>const LOGO="logo.webp";</script>
<script>
/* Her açılışta güncel sürümü yükler (GitHub Pages önbelleğini aşar) */
(async () => {
  let v = Date.now();
  try { v = (await (await fetch("version.json?t=" + Date.now(), { cache: "no-store" })).json()).v; } catch (_) {}
  const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "style.css?v=" + v; document.head.appendChild(css);
  for (const f of ["api", "sifre", "bildirim", "app"]) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "js/" + f + ".js?v=" + v; s.onload = ok; s.onerror = no; document.body.appendChild(s); });
})();
</script>
</body></html>
